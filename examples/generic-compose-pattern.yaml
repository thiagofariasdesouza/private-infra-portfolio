# Generic Compose pattern — FICTIONAL service names only.
# Not a dump of any real environment.
# Purpose: show structure for docs + healthcheck habit.

services:
  docs-site:
    image: nginx:alpine
    container_name: example-docs-site
    ports:
      - "8080:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Intentionally minimal — no real DB credentials, no private networks,
  # no host binds to sensitive paths.
